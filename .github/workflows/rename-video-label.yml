name: Rename video label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-video-label.yml'
      - 'scripts/rename_video_label_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/rename_video_label_patch.py
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/rename_video_label_patch.py .github/workflows/rename-video-label.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rename video counter label"
          git push
