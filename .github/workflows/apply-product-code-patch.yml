name: Apply product code patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-product-code-patch.yml'
      - 'scripts/apply_product_code_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_product_code_patch.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backfill_product_codes.sql supabase_product_code.sql
          git rm -f scripts/apply_product_code_patch.py .github/workflows/apply-product-code-patch.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add product code display"
          git push
