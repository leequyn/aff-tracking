<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --bg:       #F0EDFF;
      --primary:  #5B21B6;
      --p-light:  #EDE9FF;
      --accent:   #F97316;
      --a-light:  #FFF7ED;
      --text:     #1E1040;
      --muted:    #7C6FAE;
      --card:     #FFFFFF;
      --border:   #E5E0FF;
    }

    ::-webkit-scrollbar-thumb { background: #C4B8F5; border-radius: 2px; }

    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Supabase ──────────────────────────────────────────────────────────────────
    const SB_URL = 'https://ntvweheherqwdsbhhqhw.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50dndlaGVoZXJxd2RzYmhocWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTYxNjcsImV4cCI6MjA5NjA3MjE2N30.JQY1XIMpU-tOwY6Sg9zjtvG-wyE8FqNKB9Kpq-ncs_s';
    const sb = supabase.createClient(SB_URL, SB_KEY);
    const EDGE_FN = `${SB_URL}/functions/v1/tiktok-extract`;

    // ── Constants ─────────────────────────────────────────────────────────────────
    const STATUSES = [
      { id: 'chua_ro',    label: 'Chưa rõ',    bg: '#EDE9FF', fg: '#5B21B6', dot: '#7C3AED', ring: '#C4B8F5' },
      { id: 'da_ra_don',  label: 'Đã ra đơn',  bg: '#ECFDF5', fg: '#065F46', dot: '#10B981', ring: '#6EE7B7' },
      { id: 'ra_don_tot', label: 'Ra đơn tốt', bg: '#FDF2F8', fg: '#9D174D', dot: '#EC4899', ring: '#F9A8D4' },
      { id: 'fail',       label: 'Fail',       bg: '#FEF2F2', fg: '#991B1B', dot: '#EF4444', ring: '#FCA5A5' },
    ];

    // ── Helpers ───────────────────────────────────────────────────────────────────
    const getStatus = id => STATUSES.find(s => s.id === id) || STATUSES[0];
    const nextStatus = id => { const i = STATUSES.findIndex(s => s.id === id); return STATUSES[(i+1)%STATUSES.length].id; };
    const dateKey = (d = new Date()) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };
    const TODAY = () => dateKey();
    const fmtDate = d => { if (!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}/${m}`; };
    const fmtMonth = m => { if (!m) return ''; const [y,mo]=m.split('-'); return `Tháng ${parseInt(mo)}/${y}`; };
    const fmtCurrency = n => new Intl.NumberFormat('vi-VN').format(n||0) + 'đ';
    const digitsOnly = v => String(v || '').replace(/\D/g, '');
    let productCodeColumnWarningShown = false;
    const isMissingColumnError = (err, col) => {
      const msg = `${err?.message || ''} ${err?.details || ''} ${err?.hint || ''}`.toLowerCase();
      return msg.includes(col.toLowerCase()) && (msg.includes('column') || msg.includes('schema cache'));
    };

    function getProductCode(p) {
      return digitsOnly(p?.product_code);
    }

    function nextProductCode(list) {
      const max = (list || []).reduce((n, p) => {
        const code = Number(getProductCode(p));
        return Number.isFinite(code) ? Math.max(n, code) : n;
      }, 0);
      return String(max + 1);
    }

    async function fetchNextProductCode(exceptId) {
      const { data, error } = await sb.from('products').select('id, product_code');
      if (error && isMissingColumnError(error, 'product_code')) {
        warnMissingProductCodeColumn();
        throw error;
      }
      if (error) throw error;
      return nextProductCode((data || []).filter(p => p.id !== exceptId));
    }

    function warnMissingProductCodeColumn() {
      if (productCodeColumnWarningShown) return;
      productCodeColumnWarningShown = true;
      alert('Cần thêm cột product_code trong bảng products để lưu mã sản phẩm riêng. Mở Supabase SQL Editor và chạy: alter table products add column if not exists product_code text;');
    }

    function warnMissingRemainingVideosColumn() {
      alert('Cần thêm cột remaining_video_count trong bảng products để lưu số video còn lại. Mở Supabase SQL Editor và chạy file supabase_remaining_videos.sql trong repo.');
    }

    function warnMissingSchedulesTable() {
      alert('Cần tạo bảng product_schedules để lưu nhiều ngày đăng cho mỗi sản phẩm. Mở Supabase SQL Editor và chạy file supabase_product_schedules.sql trong repo.');
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    function productSchedules(p) {
      const rows = Array.isArray(p?.schedules) ? p.schedules : [];
      if (rows.length) return rows.filter(s => s.schedule_date).sort((a,b) => a.schedule_date.localeCompare(b.schedule_date));
      return p?.scheduled_date ? [{
        id: 'legacy-' + p.id,
        product_id: p.id,
        schedule_date: p.scheduled_date,
        note: p.note || '',
        video_count: 1,
        expected_remaining_count: p.remaining_video_count || 0,
        is_posted: false,
      }] : [];
    }

    function hasScheduleOn(p, date) {
      return productSchedules(p).some(s => s.schedule_date === date);
    }

    function nextScheduleDate(p) {
      const today = TODAY();
      const rows = productSchedules(p);
      return (rows.find(s => s.schedule_date >= today) || rows[0] || {}).schedule_date || '';
    }

    function scheduleSummary(p) {
      const rows = productSchedules(p);
      if (!rows.length) return [];
      const today = TODAY();
      const weekEndDate = new Date();
      weekEndDate.setDate(weekEndDate.getDate() + 6);
      const weekEnd = dateKey(weekEndDate);
      return rows.filter(s => s.schedule_date >= today && s.schedule_date <= weekEnd);
    }

    function scheduledVideosOn(p, date) {
      return productSchedules(p)
        .filter(s => s.schedule_date === date)
        .reduce((sum, s) => sum + Number(s.video_count || 0), 0);
    }

    function allScheduleItems(products) {
      return products.flatMap(p => productSchedules(p).map(s => ({
        ...s,
        product: p,
        video_count: Number(s.video_count || 0),
        expected_remaining_count: Number(s.expected_remaining_count || 0),
        is_posted: !!s.is_posted,
      }))).sort((a,b) => a.schedule_date.localeCompare(b.schedule_date) || (a.product?.name||'').localeCompare(b.product?.name||''));
    }

    function sortProducts(list) {
      const today = TODAY();
      const pinned = list.filter(p => hasScheduleOn(p, today));
      const future = list.filter(p => nextScheduleDate(p) && nextScheduleDate(p) > today)
                        .sort((a,b) => nextScheduleDate(a).localeCompare(nextScheduleDate(b)));
      const noDate = list.filter(p => !nextScheduleDate(p));
      const past   = list.filter(p => nextScheduleDate(p) && nextScheduleDate(p) < today);
      return [...pinned, ...future, ...noDate, ...past];
    }

    function parseTiktokLong(url) {
      try {
        const og = new URL(url).searchParams.get('og_info');
        if (og) { const d = JSON.parse(og); return { name: (d.title||'').trim(), image: (d.image||'').trim() }; }
      } catch(_) {}
      return null;
    }

    async function fetchTiktokShort(url) {
      try {
        const res = await fetch(EDGE_FN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${SB_KEY}` },
          body: JSON.stringify({ url }),
        });
        if (!res.ok) return null;
        const d = await res.json();
        return { name: d.title||'', image: d.imageBase64 ? `data:image/jpeg;base64,${d.imageBase64}` : d.image||'' };
      } catch(_) { return null; }
    }

    function compressImage(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const MAX = 400;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h*MAX/w); w=MAX; } else { w=Math.round(w*MAX/h); h=MAX; } }
            const c = document.createElement('canvas');
            c.width=w; c.height=h;
            c.getContext('2d').drawImage(img,0,0,w,h);
            resolve(c.toDataURL('image/jpeg', 0.82));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ── LoginPage ─────────────────────────────────────────────────────────────────
    function LoginPage() {
      const [email, setEmail] = useState('');
      const [pass,  setPass]  = useState('');
      const [err,   setErr]   = useState('');
      const [loading, setLoading] = useState(false);

      async function login() {
        if (!email||!pass) return setErr('Nhập đủ email và mật khẩu');
        setLoading(true); setErr('');
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) setErr('Email hoặc mật khẩu không đúng');
        setLoading(false);
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-5"
          style={{background:'linear-gradient(135deg,#4C1D95 0%,#7C3AED 50%,#F97316 100%)'}}>
          <div className="w-full max-w-sm">
            {/* Logo */}
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4"
                style={{background:'rgba(255,255,255,0.15)', backdropFilter:'blur(12px)'}}>
                <span className="text-3xl">✦</span>
              </div>
              <h1 className="font-display text-4xl font-bold text-white mb-1">AFF Tracking</h1>
              <p className="text-white text-sm" style={{opacity:.75}}>Quản lý sản phẩm affiliate</p>
            </div>

            {/* Card */}
            <div className="rounded-3xl p-6" style={{background:'rgba(255,255,255,0.12)', backdropFilter:'blur(20px)', border:'1px solid rgba(255,255,255,0.2)'}}>
              <div className="space-y-3">
                <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" type="email"
                  onKeyDown={e=>e.key==='Enter'&&login()}
                  className="w-full px-4 py-3 rounded-2xl text-sm outline-none"
                  style={{background:'rgba(255,255,255,0.9)', color:'#1E1040', border:'none'}} />
                <input value={pass} onChange={e=>setPass(e.target.value)} placeholder="Mật khẩu" type="password"
                  onKeyDown={e=>e.key==='Enter'&&login()}
                  className="w-full px-4 py-3 rounded-2xl text-sm outline-none"
                  style={{background:'rgba(255,255,255,0.9)', color:'#1E1040', border:'none'}} />
                {err && <p className="text-sm text-red-200 text-center">{err}</p>}
                <button onClick={login} disabled={loading}
                  className="w-full py-3.5 rounded-2xl font-bold text-sm text-white"
                  style={{background: loading ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.25)', border:'1px solid rgba(255,255,255,0.4)', letterSpacing:'0.02em'}}>
                  {loading ? 'Đang đăng nhập...' : 'Đăng nhập →'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── ProductCard ───────────────────────────────────────────────────────────────
    function ProductCard({ product: p, scheduleFilterDate, onUpdate, onDelete, onEdit }) {
      const st = getStatus(p.status);
      const [copied, setCopied] = useState(false);
      const productCode = getProductCode(p);
      const today = TODAY();
      const isToday     = hasScheduleOn(p, today);
      const isPostToday = p.post_today || isToday;
      const schedules = scheduleSummary(p);
      const displayScheduleDate = scheduleFilterDate || today;
      const displayScheduleRows = productSchedules(p).filter(s => s.schedule_date === displayScheduleDate);
      const displayScheduleVideos = scheduledVideosOn(p, displayScheduleDate);
      const displaySchedulePosted = displayScheduleRows.length > 0 && displayScheduleRows.every(s => !!s.is_posted);

      async function cycleStatus() {
        const ns = nextStatus(p.status);
        await sb.from('products').update({status:ns}).eq('id',p.id);
        onUpdate({...p, status:ns});
      }
      async function togglePostToday() {
        const v = !p.post_today;
        await sb.from('products').update({post_today:v}).eq('id',p.id);
        onUpdate({...p, post_today:v});
      }
      async function changeRemainingVideoCount(delta) {
        const v = Math.max(0,(p.remaining_video_count||0)+delta);
        const { error } = await sb.from('products').update({remaining_video_count:v}).eq('id',p.id);
        if (error && isMissingColumnError(error, 'remaining_video_count')) return warnMissingRemainingVideosColumn();
        if (error) return alert('Lỗi lưu số video còn lại: ' + error.message);
        onUpdate({...p, remaining_video_count:v});
      }
      async function setRemainingVideoCount(val) {
        const v = Math.max(0, Number(digitsOnly(val)) || 0);
        const { error } = await sb.from('products').update({remaining_video_count:v}).eq('id',p.id);
        if (error && isMissingColumnError(error, 'remaining_video_count')) return warnMissingRemainingVideosColumn();
        if (error) return alert('Lỗi lưu số video còn lại: ' + error.message);
        onUpdate({...p, remaining_video_count:v});
      }
      async function toggleSchedulePosted() {
        const rows = displayScheduleRows.filter(s => s.id && !String(s.id).startsWith('legacy-'));
        if (!rows.length) return onEdit();
        const next = !displaySchedulePosted;
        const { error } = await sb.from('product_schedules').update({is_posted:next}).in('id', rows.map(s => s.id));
        if (error) return alert('Lỗi lưu trạng thái đã đăng: ' + error.message);
        onUpdate({
          ...p,
          schedules: productSchedules(p).map(s => rows.some(r => r.id === s.id) ? {...s, is_posted:next} : s),
        });
      }
      async function copyProductCode() {
        await copyText(productCode);
        setCopied(true);
        setTimeout(() => setCopied(false), 1200);
      }

      return (
        <div className="rounded-2xl overflow-hidden card-shadow"
          style={{
            background: 'var(--card)',
            border: isPostToday ? '2px solid var(--accent)' : '2px solid transparent',
            transition: 'border-color 0.2s',
          }}>
          <div className="flex gap-3 p-3.5 pb-2">
            {/* Image — click to open link */}
            {p.link
              ? <a href={p.link} target="_blank" rel="noopener noreferrer"
                  className="flex-shrink-0 w-[72px] h-[72px] rounded-xl overflow-hidden flex items-center justify-center"
                  style={{background:'var(--p-light)'}}>
                  {p.image_data
                    ? <img src={p.image_data} alt="" className="w-full h-full object-cover" />
                    : <span className="text-3xl">🛍</span>}
                </a>
              : <div className="flex-shrink-0 w-[72px] h-[72px] rounded-xl overflow-hidden flex items-center justify-center"
                  style={{background:'var(--p-light)'}}>
                  {p.image_data
                    ? <img src={p.image_data} alt="" className="w-full h-full object-cover" />
                    : <span className="text-3xl">🛍</span>}
                </div>
            }

            {/* Content */}
            <div className="flex-1 min-w-0">
              <div className="flex items-start justify-between gap-1">
                {/* Name — click to open link */}
                {p.link
                  ? <a href={p.link} target="_blank" rel="noopener noreferrer"
                      className="font-bold text-sm leading-snug line-clamp-2 flex-1"
                      style={{color:'var(--primary)', textDecoration:'none'}}>
                      {p.name || <span style={{fontStyle:'italic', opacity:.6}}>Chưa có tên</span>}
                    </a>
                  : <p className="font-semibold text-sm leading-snug line-clamp-2 flex-1" style={{color:'var(--text)'}}>
                      {p.name || <span style={{color:'var(--muted)', fontStyle:'italic'}}>Chưa có tên</span>}
                    </p>
                }
                <div className="flex gap-0.5 flex-shrink-0 ml-1">
                  <button onClick={onEdit}
                    className="w-7 h-7 rounded-lg flex items-center justify-center text-xs"
                    style={{background:'var(--p-light)', color:'var(--primary)'}}>✏️</button>
                  <button onClick={()=>onDelete(p.id)}
                    className="w-7 h-7 rounded-lg flex items-center justify-center text-xs"
                    style={{background:'#FFF0F0', color:'#EF4444'}}>🗑</button>
                </div>
              </div>

              <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                {productCode && <button onClick={copyProductCode} title="Bấm để copy mã sản phẩm"
                  className="text-xs px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1"
                  style={{background:'#ECFDF5', color:'#065F46', border:'1px solid #6EE7B7'}}>
                  <span>#</span>
                  {productCode}
                  <span style={{opacity:.75}}>{copied ? '✓' : '⧉'}</span>
                </button>}
                <span className="text-xs px-2.5 py-0.5 rounded-full font-semibold"
                  style={{background:'var(--p-light)', color:'var(--primary)'}}>{p.channel}</span>
                <button onClick={cycleStatus}
                  className="text-xs px-2.5 py-0.5 rounded-full font-semibold flex items-center gap-1"
                  style={{background:st.bg, color:st.fg, border:`1px solid ${st.ring}`}}>
                  <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{background:st.dot}} />
                  {st.label}
                </button>
                <div className="flex items-center gap-1 rounded-full px-1.5 py-0.5"
                  style={{background:'#ECFDF5', color:'#065F46', border:'1px solid #6EE7B7'}}>
                  <button onClick={()=>changeRemainingVideoCount(-1)}
                    className="w-5 h-5 rounded-full text-xs font-bold"
                    style={{background:'#D1FAE5', color:'#047857'}}>−</button>
                  <span className="text-xs font-bold">còn</span>
                  <input value={p.remaining_video_count||0}
                    onChange={e=>setRemainingVideoCount(e.target.value)}
                    inputMode="numeric"
                    className="w-8 text-xs font-bold text-center outline-none"
                    style={{background:'transparent', color:'#065F46'}} />
                  <button onClick={()=>changeRemainingVideoCount(1)}
                    className="w-5 h-5 rounded-full text-xs font-bold"
                    style={{background:'#D1FAE5', color:'#047857'}}>+</button>
                </div>
                <label className="flex items-center gap-1.5 rounded-full px-2.5 py-0.5"
                  title="Tích khi đã đăng theo ngày đang lọc"
                  style={{background:displaySchedulePosted?'#DBEAFE':'#E0F2FE', color:'#0369A1', border:'1px solid #7DD3FC'}}>
                  <input type="checkbox" checked={displaySchedulePosted}
                    disabled={displayScheduleRows.length === 0}
                    onChange={toggleSchedulePosted}
                    className="w-3.5 h-3.5 accent-sky-600" />
                  <span className="text-xs font-bold">{displayScheduleVideos} đăng</span>
                </label>
              </div>
            </div>
          </div>

          {/* Note — prominent */}
          {p.note && (
            <div className="mx-3.5 mb-2">
              <span className="text-sm font-medium px-2.5 py-1 rounded-lg"
                style={{background:'#FDF2F8', border:'1px solid #F9A8D4', color:'#9D174D'}}>
                {p.note}
              </span>
            </div>
          )}

          {schedules.length > 0 && (
            <div className="mx-3.5 mb-2 flex gap-1.5 overflow-x-auto no-scrollbar">
              {schedules.map(s => (
                <button key={s.id || s.schedule_date} onClick={onEdit}
                  className="flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-bold text-left"
                  style={{background:s.schedule_date===today?'#FFF7ED':'var(--bg)', color:s.schedule_date===today?'#C2410C':'var(--muted)', border:`1px solid ${s.schedule_date===today?'#FED7AA':'var(--border)'}`}}>
                  <span className="block">{fmtDate(s.schedule_date)} · {s.video_count||0} đăng</span>
                  {s.note && <span className="block mt-0.5 text-[11px] font-medium truncate max-w-[11rem]" style={{color:'#9D174D'}}>{s.note}</span>}
                </button>
              ))}
            </div>
          )}

          {/* Footer bar */}
          <div className="flex items-center gap-2 px-3.5 pb-3 pt-0 flex-wrap">
            {/* Post today */}
            <button onClick={togglePostToday}
              className="ml-auto flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold"
              style={{
                background: isPostToday ? 'var(--accent)' : 'var(--bg)',
                color: isPostToday ? '#fff' : 'var(--muted)',
                transition: 'all 0.2s',
              }}>
              <span>{isPostToday ? '📌' : '○'}</span>
              Đăng hôm nay
            </button>
          </div>
        </div>
      );
    }

    // ── ProductModal ──────────────────────────────────────────────────────────────
    function ProductModal({ product, channels, onSave, onChannelsChange, onClose }) {
      const editing = !!product?.id;
      const initialSchedules = productSchedules(product || {});
      const [form, setForm] = useState({
        name:           product?.name||'',
        link:           product?.link||'',
        image_data:     product?.image_data||'',
        product_code:   product ? getProductCode(product) : '',
        channel:        product?.channel||(channels[0]||''),
        new_channel:    '',
        status:         product?.status||'chua_ro',
        remaining_video_count: product?.remaining_video_count||0,
        note:           product?.note||'',
      });
      const [scheduleRows, setScheduleRows] = useState(
        initialSchedules.map(s => ({
          id: String(s.id || ''),
          local_id: String(s.id || Math.random()),
          schedule_date: s.schedule_date || '',
          note: s.note || '',
          video_count: String(s.video_count || 1),
          expected_remaining_count: String(s.expected_remaining_count ?? product?.remaining_video_count ?? 0),
          is_posted: !!s.is_posted,
        }))
      );
      const [deletedScheduleIds, setDeletedScheduleIds] = useState([]);
      const [extracting, setExtracting] = useState(false);
      const [saving,     setSaving]     = useState(false);
      const [editCh,     setEditCh]     = useState(false);
      const fileRef = useRef();

      useEffect(() => {
        if (editing || form.product_code) return;
        fetchNextProductCode().then(code => set('product_code', code)).catch(() => {});
      }, []);

      async function moveCh(name, dir) {
        const idx = channels.indexOf(name);
        const next = idx + dir;
        if (next < 0 || next >= channels.length) return;
        const newOrder = [...channels];
        [newOrder[idx], newOrder[next]] = [newOrder[next], newOrder[idx]];
        onChannelsChange(newOrder);
        // update positions in DB
        await Promise.all(newOrder.map((n, i) =>
          sb.from('channels').upsert({ name: n, position: i }, { onConflict: 'name' })
        ));
      }

      async function deleteCh(name) {
        if (!confirm(`Xoá kênh "${name}"? Sản phẩm hiện có vẫn giữ kênh này.`)) return;
        await sb.from('channels').delete().eq('name', name);
        const newOrder = channels.filter(c => c !== name);
        onChannelsChange(newOrder);
        if (form.channel === name) set('channel', newOrder[0] || '');
      }
      const set = (k,v) => setForm(f=>({...f,[k]:v}));
      const setSchedule = (localId, key, val) =>
        setScheduleRows(rows => rows.map(r => r.local_id === localId ? {...r, [key]:val} : r));
      function addScheduleRow() {
        const remain = Number(digitsOnly(form.remaining_video_count));
        setScheduleRows(rows => [...rows, {
          id: '',
          local_id: 'new-' + Date.now() + '-' + Math.random(),
          schedule_date: TODAY(),
          note: '',
          video_count: '1',
          expected_remaining_count: String(Math.max(0, remain - rows.reduce((s,r)=>s+Number(digitsOnly(r.video_count)||0), 1))),
          is_posted: false,
        }]);
      }
      function removeScheduleRow(row) {
        if (row.id && !row.id.startsWith('legacy-')) setDeletedScheduleIds(ids => [...ids, row.id]);
        setScheduleRows(rows => rows.filter(r => r.local_id !== row.local_id));
      }

      async function saveSchedules(productId) {
        const rows = scheduleRows
          .filter(r => r.schedule_date)
          .map(r => {
            const row = {
              product_id: String(productId),
              schedule_date: r.schedule_date,
              note: (r.note || '').trim(),
              video_count: Number(digitsOnly(r.video_count)) || 0,
              expected_remaining_count: Number(digitsOnly(r.expected_remaining_count)) || 0,
              is_posted: !!r.is_posted,
            };
            if (r.id && !r.id.startsWith('legacy-')) row.id = r.id;
            return row;
          });
        if (deletedScheduleIds.length) {
          const { error } = await sb.from('product_schedules').delete().in('id', deletedScheduleIds);
          if (error && error.code === '42P01') {
            warnMissingSchedulesTable();
            throw error;
          }
          if (error) throw error;
        }
        if (!rows.length) return [];
        const { data, error } = await sb.from('product_schedules').upsert(rows).select();
        if (error && error.code === '42P01') {
          warnMissingSchedulesTable();
          throw error;
        }
        if (error) throw error;
        return data || [];
      }

      // Paste ảnh từ clipboard (Cmd+V bất kỳ đâu trong modal)
      useEffect(() => {
        async function onClipboardPaste(e) {
          const items = e.clipboardData?.items;
          if (!items) return;
          for (const item of Array.from(items)) {
            if (item.type.startsWith('image/')) {
              e.preventDefault();
              const file = item.getAsFile();
              if (file) { const data = await compressImage(file); set('image_data', data); }
              return;
            }
          }
        }
        document.addEventListener('paste', onClipboardPaste);
        return () => document.removeEventListener('paste', onClipboardPaste);
      }, []);

      async function extractUrl(urlOverride) {
        const url = urlOverride || form.link;
        if (!url) return;
        setExtracting(true);
        let r = parseTiktokLong(url);
        if (!r) r = await fetchTiktokShort(url);
        if (r) {
          if (r.name)  set('name', r.name);
          if (r.image) set('image_data', r.image);
        } else {
          alert('Không lấy được thông tin. Hãy nhập tay hoặc dùng link share qua Messenger/Zalo.');
        }
        setExtracting(false);
      }

      function handleLinkPaste(e) {
        const pasted = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (!pasted || !pasted.includes('tiktok')) return;
        e.preventDefault();
        set('link', pasted);
        extractUrl(pasted);
      }

      async function onFile(e) {
        const f = e.target.files[0];
        if (!f) return;
        set('image_data', await compressImage(f));
      }

      async function save() {
        if (!form.name.trim()) return alert('Nhập tên sản phẩm');
        const ch = form.new_channel.trim() || form.channel;
        if (!ch) return alert('Chọn hoặc nhập kênh');
        setSaving(true);
        try {
          const productCode = digitsOnly(form.product_code) || await fetchNextProductCode(editing ? product.id : null);
          const payload = {
            name:           form.name.trim(),
            link:           form.link.trim(),
            image_data:     form.image_data,
            product_code:   productCode,
            channel:        ch,
            status:         form.status,
            remaining_video_count: Number(digitsOnly(form.remaining_video_count)),
            note:           form.note.trim(),
            scheduled_date: scheduleRows.find(r => r.schedule_date)?.schedule_date || null,
          };
          // nếu là kênh mới → thêm vào channels table
          if (!channels.includes(ch)) {
            await sb.from('channels').upsert({ name: ch, position: channels.length }, { onConflict: 'name' });
            onChannelsChange([...channels, ch]);
          }
          if (editing) {
            const { data, error } = await sb.from('products').update(payload).eq('id',product.id).select().single();
            if (error && isMissingColumnError(error, 'product_code')) {
              warnMissingProductCodeColumn();
              throw error;
            }
            if (error && isMissingColumnError(error, 'remaining_video_count')) {
              warnMissingRemainingVideosColumn();
              throw error;
            }
            if (error) throw error;
            const schedules = await saveSchedules(data.id);
            onSave({...data, schedules});
          } else {
            const { data, error } = await sb.from('products').insert({...payload, video_count:0, post_today:false}).select().single();
            if (error && isMissingColumnError(error, 'product_code')) {
              warnMissingProductCodeColumn();
              throw error;
            }
            if (error && isMissingColumnError(error, 'remaining_video_count')) {
              warnMissingRemainingVideosColumn();
              throw error;
            }
            if (error) throw error;
            const schedules = await saveSchedules(data.id);
            onSave({...data, schedules});
          }
        } catch(err) {
          alert('Lỗi lưu: ' + (err.message || JSON.stringify(err)));
          setSaving(false);
        }
      }

      const useNew = form.new_channel.trim().length > 0;

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center"
          style={{background:'rgba(30,16,64,0.6)', backdropFilter:'blur(4px)'}}
          onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[92vh] overflow-y-auto"
            style={{background:'var(--card)', border:'1px solid var(--border)'}}>

            {/* Header */}
            <div className="flex items-center justify-between mb-5">
              <h2 className="font-display text-xl font-bold" style={{color:'var(--text)'}}>
                {editing ? '✏️ Sửa sản phẩm' : '✦ Thêm sản phẩm'}
              </h2>
              <button onClick={onClose}
                className="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold"
                style={{background:'var(--bg)', color:'var(--muted)'}}>✕</button>
            </div>

            <div className="space-y-4">
              {/* TikTok URL */}
              <div>
                <label className="text-xs font-bold mb-1.5 block tracking-wide uppercase" style={{color:'var(--muted)'}}>Link TikTok</label>
                <div className="flex gap-2">
                  <input value={form.link} onChange={e=>set('link',e.target.value)}
                    onPaste={handleLinkPaste}
                    placeholder="Dán link vt.tiktok.com..."
                    className="flex-1 px-4 py-3 rounded-2xl text-sm outline-none"
                    style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
                  <button onClick={extractUrl} disabled={extracting||!form.link}
                    className="px-4 py-3 rounded-2xl text-sm font-bold flex-shrink-0"
                    style={{background: form.link ? 'var(--primary)' : 'var(--bg)', color: form.link ? '#fff' : 'var(--muted)', transition:'all 0.2s'}}>
                    {extracting ? '⏳' : '🔍'}
                  </button>
                </div>
                {extracting && (
                  <p className="text-xs mt-1.5 font-medium" style={{color:'var(--primary)'}}>Đang lấy thông tin...</p>
                )}
              </div>

              {/* Name */}
              <div>
                <label className="text-xs font-bold mb-1.5 block tracking-wide uppercase" style={{color:'var(--muted)'}}>Tên sản phẩm *</label>
                <input value={form.name} onChange={e=>set('name',e.target.value)}
                  placeholder="Tên sản phẩm"
                  className="w-full px-4 py-3 rounded-2xl text-sm outline-none"
                  style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
              </div>

              {/* Product code */}
              <div>
                <label className="text-xs font-bold mb-1.5 block tracking-wide uppercase" style={{color:'var(--muted)'}}>Mã sản phẩm</label>
                <div className="flex gap-2">
                  <input value={form.product_code} onChange={e=>set('product_code',digitsOnly(e.target.value))}
                    placeholder="Chỉ nhập số"
                    inputMode="numeric"
                    className="flex-1 px-4 py-3 rounded-2xl text-sm outline-none font-bold"
                    style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
                  <button onClick={async()=>set('product_code', await fetchNextProductCode(editing ? product.id : null))}
                    className="px-4 py-3 rounded-2xl text-sm font-bold flex-shrink-0"
                    style={{background:'var(--p-light)', color:'var(--primary)', border:'1.5px solid var(--border)'}}>
                    Tạo mã
                  </button>
                </div>
              </div>

              {/* Image */}
              <div>
                <label className="text-xs font-bold mb-1.5 block tracking-wide uppercase" style={{color:'var(--muted)'}}>Ảnh sản phẩm</label>
                <div className="flex gap-3 items-start">
                  {/* Preview — click để paste */}
                  <div className="w-16 h-16 rounded-2xl overflow-hidden flex items-center justify-center flex-shrink-0 cursor-pointer relative group"
                    style={{background:'var(--p-light)'}}
                    title="Click rồi Cmd+V để dán ảnh">
                    {form.image_data
                      ? <img src={form.image_data} alt="" className="w-full h-full object-cover" />
                      : <span className="text-2xl">🛍</span>}
                  </div>
                  <div className="flex flex-col gap-2 flex-1">
                    <div className="flex gap-2 flex-wrap">
                      <button onClick={()=>fileRef.current.click()}
                        className="px-3.5 py-2.5 rounded-xl text-sm font-bold"
                        style={{background:'var(--p-light)', color:'var(--primary)'}}>
                        📷 Tải lên
                      </button>
                      <button
                        onClick={async () => {
                          try {
                            const [item] = await navigator.clipboard.read().catch(() => []);
                            if (!item) return alert('Không có ảnh trong clipboard. Hãy copy ảnh trước rồi thử lại.');
                            for (const type of item.types) {
                              if (type.startsWith('image/')) {
                                const blob = await item.getType(type);
                                const data = await compressImage(new File([blob], 'img.jpg', {type}));
                                set('image_data', data);
                                return;
                              }
                            }
                            alert('Clipboard không có ảnh. Hãy copy ảnh trước.');
                          } catch(_) {
                            alert('Dùng Cmd+V bất kỳ đâu trong popup này để dán ảnh.');
                          }
                        }}
                        className="px-3.5 py-2.5 rounded-xl text-sm font-bold"
                        style={{background:'var(--bg)', color:'var(--muted)', border:'1.5px dashed var(--border)'}}>
                        📋 Dán ảnh
                      </button>
                      {form.image_data && (
                        <button onClick={()=>set('image_data','')}
                          className="px-3 py-2.5 rounded-xl text-sm font-bold"
                          style={{background:'#FFF0F0', color:'#EF4444'}}>Xoá</button>
                      )}
                    </div>
                    <p className="text-xs" style={{color:'var(--muted)'}}>Copy ảnh bất kỳ → Cmd+V trong popup này là xong</p>
                  </div>
                </div>
                <input ref={fileRef} type="file" accept="image/*" onChange={onFile} className="hidden" />
              </div>

              {/* Channel */}
              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="text-xs font-bold tracking-wide uppercase" style={{color:'var(--muted)'}}>Kênh *</label>
                  {channels.length > 0 && (
                    <button onClick={()=>setEditCh(v=>!v)}
                      className="text-xs px-2.5 py-1 rounded-lg font-bold"
                      style={{background: editCh ? 'var(--primary)' : 'var(--p-light)', color: editCh ? '#fff' : 'var(--primary)'}}>
                      {editCh ? '✓ Xong' : '⚙ Sửa'}
                    </button>
                  )}
                </div>

                {/* Edit mode: reorder + delete */}
                {editCh ? (
                  <div className="rounded-2xl overflow-hidden mb-2" style={{border:'1.5px solid var(--border)'}}>
                    {channels.map((ch, i) => (
                      <div key={ch} className="flex items-center gap-2 px-3 py-2.5"
                        style={{borderBottom: i < channels.length-1 ? '1px solid var(--border)' : 'none', background:'var(--bg)'}}>
                        <span className="flex-1 text-sm font-semibold" style={{color:'var(--text)'}}>{ch}</span>
                        <button onClick={()=>moveCh(ch,-1)} disabled={i===0}
                          className="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold"
                          style={{background:'var(--card)', color: i===0 ? '#C4B8F5' : 'var(--primary)', opacity: i===0 ? .4 : 1}}>↑</button>
                        <button onClick={()=>moveCh(ch,1)} disabled={i===channels.length-1}
                          className="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold"
                          style={{background:'var(--card)', color: i===channels.length-1 ? '#C4B8F5' : 'var(--primary)', opacity: i===channels.length-1 ? .4 : 1}}>↓</button>
                        <button onClick={()=>deleteCh(ch)}
                          className="w-7 h-7 rounded-lg flex items-center justify-center text-xs"
                          style={{background:'#FFF0F0', color:'#EF4444'}}>🗑</button>
                      </div>
                    ))}
                  </div>
                ) : (
                  channels.length > 0 && !useNew && (
                    <div className="flex flex-wrap gap-2 mb-2">
                      {channels.map(ch=>(
                        <button key={ch} onClick={()=>set('channel',ch)}
                          className="px-3.5 py-2 rounded-xl text-sm font-bold"
                          style={{
                            background: form.channel===ch ? 'var(--primary)' : 'var(--bg)',
                            color:      form.channel===ch ? '#fff' : 'var(--muted)',
                            border:     `1.5px solid ${form.channel===ch ? 'var(--primary)' : 'var(--border)'}`,
                          }}>
                          {ch}
                        </button>
                      ))}
                    </div>
                  )
                )}

                <input value={form.new_channel} onChange={e=>set('new_channel',e.target.value)}
                  placeholder={channels.length ? '+ Thêm kênh mới...' : 'Tên kênh (VD: Kênh chính)'}
                  className="w-full px-4 py-3 rounded-2xl text-sm outline-none"
                  style={{
                    background:'var(--bg)', color:'var(--text)',
                    border:`1.5px solid ${useNew ? 'var(--primary)' : 'var(--border)'}`,
                  }} />
              </div>

              {/* Status */}
              <div>
                <label className="text-xs font-bold mb-1.5 block tracking-wide uppercase" style={{color:'var(--muted)'}}>Trạng thái</label>
                <div className="flex flex-wrap gap-2">
                  {STATUSES.map(st=>(
                    <button key={st.id} onClick={()=>set('status',st.id)}
                      className="px-3.5 py-2 rounded-xl text-sm font-bold flex items-center gap-1.5"
                      style={{
                        background: form.status===st.id ? st.bg : 'var(--bg)',
                        color:      form.status===st.id ? st.fg : 'var(--muted)',
                        border:     `1.5px solid ${form.status===st.id ? st.ring : 'var(--border)'}`,
                      }}>
                      <span className="w-2 h-2 rounded-full" style={{background: form.status===st.id ? st.dot : '#C4B8F5'}} />
                      {st.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Schedule rows */}
              <div>
                <div className="mb-2">
                  <label className="text-xs font-bold tracking-wide uppercase" style={{color:'var(--muted)'}}>Lịch đăng</label>
                </div>
                <div className="space-y-2">
                  {scheduleRows.length === 0 ? (
                    <div className="rounded-2xl px-4 py-3 text-sm font-medium text-center"
                      style={{background:'var(--bg)', color:'var(--muted)', border:'1.5px dashed var(--border)'}}>
                      Chưa có lịch đăng
                    </div>
                  ) : scheduleRows.map(row => (
                    <div key={row.local_id} className="rounded-2xl p-3 space-y-2" style={{background:'var(--bg)', border:'1.5px solid var(--border)'}}>
                      <div className="flex gap-2 items-center">
                        <input type="date" value={row.schedule_date} onChange={e=>setSchedule(row.local_id,'schedule_date',e.target.value)}
                          className="flex-1 px-3 py-2 rounded-xl text-sm outline-none font-semibold"
                          style={{background:'var(--card)', color:'var(--text)', border:'1px solid var(--border)'}} />
                        <input value={row.video_count} onChange={e=>setSchedule(row.local_id,'video_count',digitsOnly(e.target.value))}
                          placeholder="video" inputMode="numeric"
                          className="w-20 px-3 py-2 rounded-xl text-sm outline-none font-bold text-center"
                          style={{background:'var(--card)', color:'var(--primary)', border:'1px solid var(--border)'}} />
                        <label className="w-10 h-10 rounded-xl flex items-center justify-center"
                          title="Đã đăng"
                          style={{background:row.is_posted?'#E0F2FE':'var(--card)', border:`1px solid ${row.is_posted?'#7DD3FC':'var(--border)'}`}}>
                          <input type="checkbox" checked={!!row.is_posted}
                            onChange={e=>setSchedule(row.local_id,'is_posted',e.target.checked)}
                            className="w-4 h-4 accent-sky-600" />
                        </label>
                        <input value={row.expected_remaining_count} onChange={e=>setSchedule(row.local_id,'expected_remaining_count',digitsOnly(e.target.value))}
                          placeholder="còn" inputMode="numeric"
                          className="w-20 px-3 py-2 rounded-xl text-sm outline-none font-bold text-center"
                          style={{background:'#ECFDF5', color:'#065F46', border:'1px solid #6EE7B7'}} />
                        <button onClick={()=>removeScheduleRow(row)}
                          className="w-8 h-8 rounded-xl flex items-center justify-center text-xs"
                          style={{background:'#FFF0F0', color:'#EF4444'}}>🗑</button>
                      </div>
                      <input value={row.note} onChange={e=>setSchedule(row.local_id,'note',e.target.value)}
                        placeholder="Note riêng cho ngày này"
                        className="w-full px-3 py-2 rounded-xl text-sm outline-none"
                        style={{background:'var(--card)', color:'var(--text)', border:'1px solid var(--border)'}} />
                    </div>
                  ))}
                </div>
                <button onClick={addScheduleRow}
                  className="mt-3 w-full py-3 rounded-2xl font-bold text-sm"
                  style={{background:'var(--p-light)', color:'var(--primary)', border:'1.5px solid var(--border)'}}>
                  + Thêm ngày
                </button>
              </div>

              {/* Note */}
              <div>
                <label className="text-xs font-bold mb-1.5 block tracking-wide uppercase" style={{color:'var(--muted)'}}>Ghi chú</label>
                <input value={form.note} onChange={e=>set('note',e.target.value)}
                  placeholder="VD: hoa hồng 15%"
                  className="w-full px-4 py-3 rounded-2xl text-sm outline-none"
                  style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
              </div>

              {/* Buttons */}
              <div className="flex gap-2 pt-1">
                <button onClick={onClose}
                  className="flex-1 py-3.5 rounded-2xl font-bold text-sm"
                  style={{background:'var(--bg)', color:'var(--muted)', border:'1.5px solid var(--border)'}}>Huỷ</button>
                <button onClick={save} disabled={saving}
                  className="flex-1 py-3.5 rounded-2xl font-bold text-sm text-white"
                  style={{background: saving ? '#A78BFA' : 'var(--primary)', transition:'background 0.2s'}}>
                  {saving ? 'Đang lưu...' : (editing ? 'Cập nhật ✓' : 'Thêm sản phẩm +')}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── ExpenseModal ─────────────────────────────────────────────────────────────
    function ExpenseModal({ selMonth, channels, onSave, onClose }) {
      const [form, setForm] = useState({
        date: TODAY(), tool_name: '', amount: '', channel: '', note: ''
      });
      const [saving, setSaving] = useState(false);
      const set = (k,v) => setForm(f=>({...f,[k]:v}));

      async function save() {
        if (!form.tool_name.trim()) return alert('Nhập tên tool');
        if (!form.amount || isNaN(Number(form.amount))) return alert('Nhập số tiền hợp lệ');
        setSaving(true);
        const payload = {
          date: form.date || TODAY(),
          tool_name: form.tool_name.trim(),
          amount: Number(String(form.amount).replace(/[^0-9]/g,'')),
          channel: form.channel,
          note: form.note.trim(),
        };
        const { data, error } = await sb.from('expenses').insert(payload).select().single();
        if (error) { alert('Lỗi: ' + error.message); setSaving(false); return; }
        onSave(data);
      }

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center"
          style={{background:'rgba(30,16,64,0.6)', backdropFilter:'blur(4px)'}}
          onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6"
            style={{background:'var(--card)', border:'1px solid var(--border)'}}>
            <div className="flex items-center justify-between mb-5">
              <h2 className="font-display text-xl font-bold" style={{color:'var(--text)'}}>+ Chi phí tool</h2>
              <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold"
                style={{background:'var(--bg)', color:'var(--muted)'}}>✕</button>
            </div>
            <div className="space-y-3">
              <div className="flex gap-2">
                <div className="flex-1">
                  <label className="text-xs font-bold mb-1 block uppercase tracking-wide" style={{color:'var(--muted)'}}>Ngày</label>
                  <input type="date" value={form.date} onChange={e=>set('date',e.target.value)}
                    className="w-full px-3 py-2.5 rounded-xl text-sm outline-none"
                    style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
                </div>
                <div className="flex-1">
                  <label className="text-xs font-bold mb-1 block uppercase tracking-wide" style={{color:'var(--muted)'}}>Kênh</label>
                  <select value={form.channel} onChange={e=>set('channel',e.target.value)}
                    className="w-full px-3 py-2.5 rounded-xl text-sm outline-none"
                    style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}}>
                    <option value="">Chung</option>
                    {channels.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label className="text-xs font-bold mb-1 block uppercase tracking-wide" style={{color:'var(--muted)'}}>Tên tool *</label>
                <input value={form.tool_name} onChange={e=>set('tool_name',e.target.value)}
                  placeholder="VD: ChatGPT Plus, Runway, Canva Pro..."
                  className="w-full px-3 py-2.5 rounded-xl text-sm outline-none"
                  style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
              </div>
              <div>
                <label className="text-xs font-bold mb-1 block uppercase tracking-wide" style={{color:'var(--muted)'}}>Số tiền (đ) *</label>
                <input value={form.amount} onChange={e=>set('amount',e.target.value)}
                  placeholder="VD: 500000"
                  inputMode="numeric"
                  className="w-full px-3 py-2.5 rounded-xl text-sm outline-none"
                  style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
              </div>
              <div>
                <label className="text-xs font-bold mb-1 block uppercase tracking-wide" style={{color:'var(--muted)'}}>Ghi chú</label>
                <input value={form.note} onChange={e=>set('note',e.target.value)}
                  placeholder="VD: gói tháng, gia hạn..."
                  className="w-full px-3 py-2.5 rounded-xl text-sm outline-none"
                  style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
              </div>
              <div className="flex gap-2 pt-1">
                <button onClick={onClose} className="flex-1 py-3 rounded-2xl font-bold text-sm"
                  style={{background:'var(--bg)', color:'var(--muted)', border:'1.5px solid var(--border)'}}>Huỷ</button>
                <button onClick={save} disabled={saving} className="flex-1 py-3 rounded-2xl font-bold text-sm text-white"
                  style={{background: saving ? '#A78BFA' : 'var(--primary)'}}>
                  {saving ? 'Đang lưu...' : 'Thêm +'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── ExpensePage ───────────────────────────────────────────────────────────────
    function monthsInRange(from, to) {
      const ms = [], d = new Date(from+'-01'), end = new Date(to+'-01');
      while (d <= end) { ms.push(d.toISOString().slice(0,7)); d.setMonth(d.getMonth()+1); }
      return ms;
    }

    function ExpensePage({ channels }) {
      const curM = TODAY().slice(0,7);
      const [fromM,        setFromM]        = useState(curM);
      const [toM,          setToM]          = useState(curM);
      const [filterCh,     setFilterCh]     = useState('all');
      const [expenses,     setExpenses]     = useState([]);
      const [revenues,     setRevenues]     = useState([]);
      const [revForms,     setRevForms]     = useState({});
      const [savingRev,    setSavingRev]    = useState({});
      const [showExpModal, setShowExpModal] = useState(false);

      useEffect(() => { fetchAll(); }, [fromM, toM, filterCh]);

      async function fetchAll() {
        const months = monthsInRange(fromM, toM);
        if (!months.length) return;
        const lastD = (() => { const d=new Date(toM+'-01'); d.setMonth(d.getMonth()+1); d.setDate(0); return String(d.getDate()).padStart(2,'0'); })();
        let eq = sb.from('expenses').select('*').gte('date',fromM+'-01').lte('date',`${toM}-${lastD}`).order('date',{ascending:false});
        if (filterCh !== 'all') eq = eq.eq('channel', filterCh);
        const {data:eData} = await eq;
        if (eData) setExpenses(eData);

        let rq = sb.from('revenues').select('*').in('month', months);
        if (filterCh !== 'all') rq = rq.eq('channel', filterCh);
        const {data:rData} = await rq;
        if (rData) {
          setRevenues(rData);
          const f={};
          rData.forEach(r => { f[r.month+'|'+r.channel]={revenue:r.revenue,commission:r.commission,actual_received:r.actual_received,note:r.note||''}; });
          setRevForms(f);
        }
      }

      async function deleteExp(id) {
        if (!confirm('Xoá khoản chi này?')) return;
        await sb.from('expenses').delete().eq('id',id);
        setExpenses(prev=>prev.filter(e=>e.id!==id));
      }

      async function saveRevenue(month, channel) {
        const key = month+'|'+channel;
        const f = revForms[key]||{};
        setSavingRev(s=>({...s,[key]:true}));
        const payload = {month, channel, revenue:Number(f.revenue||0), commission:Number(f.commission||0), actual_received:Number(f.actual_received||0), note:f.note||''};
        const {data,error} = await sb.from('revenues').upsert(payload,{onConflict:'month,channel'}).select().single();
        if (!error&&data) setRevenues(prev=>{ const ex=prev.find(r=>r.month===month&&r.channel===channel); return ex?prev.map(r=>r.month===month&&r.channel===channel?data:r):[...prev,data]; });
        setSavingRev(s=>({...s,[key]:false}));
      }

      function setRevField(month, channel, key, val) {
        const k = month+'|'+channel;
        setRevForms(f=>({...f,[k]:{...(f[k]||{}), [key]:val}}));
      }

      const allMonths   = monthsInRange(fromM, toM);
      const monthStats  = allMonths.map(m => {
        const mExp = expenses.filter(e=>e.date.startsWith(m)).reduce((s,e)=>s+(e.amount||0),0);
        const mRev = revenues.filter(r=>r.month===m).reduce((s,r)=>s+(r.actual_received||0),0);
        return {m, exp:mExp, rev:mRev, profit:mRev-mExp};
      });
      const totExp    = monthStats.reduce((s,x)=>s+x.exp,0);
      const totRev    = monthStats.reduce((s,x)=>s+x.rev,0);
      const totProfit = totRev - totExp;
      const revChs    = filterCh==='all' ? [...channels,'Tổng'] : [filterCh];

      return (
        <div className="space-y-4">
          {/* Filters */}
          <div className="rounded-2xl p-4 card-shadow space-y-3" style={{background:'var(--card)'}}>
            <div>
              <p className="text-xs font-bold uppercase tracking-wide mb-2" style={{color:'var(--muted)'}}>Kênh</p>
              <div className="flex gap-2 flex-wrap">
                {[{id:'all',label:'Tất cả'}, ...channels.map(c=>({id:c,label:c}))].map(ch=>(
                  <button key={ch.id} onClick={()=>setFilterCh(ch.id)}
                    className="px-3 py-1.5 rounded-full text-xs font-bold"
                    style={{background:filterCh===ch.id?'var(--primary)':'var(--bg)', color:filterCh===ch.id?'#fff':'var(--muted)', border:`1.5px solid ${filterCh===ch.id?'var(--primary)':'var(--border)'}`}}>
                    {ch.label}
                  </button>
                ))}
              </div>
            </div>
            <div className="flex gap-3">
              <div className="flex-1">
                <p className="text-xs font-bold uppercase tracking-wide mb-1" style={{color:'var(--muted)'}}>Từ tháng</p>
                <input type="month" value={fromM} onChange={e=>{setFromM(e.target.value); if(e.target.value>toM) setToM(e.target.value);}}
                  className="w-full px-3 py-2 rounded-xl text-sm outline-none"
                  style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
              </div>
              <div className="flex-1">
                <p className="text-xs font-bold uppercase tracking-wide mb-1" style={{color:'var(--muted)'}}>Đến tháng</p>
                <input type="month" value={toM} onChange={e=>{setToM(e.target.value); if(e.target.value<fromM) setFromM(e.target.value);}}
                  className="w-full px-3 py-2 rounded-xl text-sm outline-none"
                  style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
              </div>
            </div>
          </div>

          {/* Summary stats */}
          <div className="grid gap-3" style={{gridTemplateColumns:'1fr 1fr 1fr'}}>
            <div className="rounded-2xl p-3 card-shadow" style={{background:'var(--card)'}}>
              <p className="text-xs font-semibold mb-1" style={{color:'var(--muted)'}}>Chi phí tools</p>
              <p className="font-bold font-display text-base" style={{color:'var(--primary)'}}>{fmtCurrency(totExp)}</p>
            </div>
            <div className="rounded-2xl p-3 card-shadow" style={{background:'var(--card)'}}>
              <p className="text-xs font-semibold mb-1" style={{color:'var(--muted)'}}>Thực nhận</p>
              <p className="font-bold font-display text-base" style={{color:'#065F46'}}>{fmtCurrency(totRev)}</p>
            </div>
            <div className="rounded-2xl p-3" style={{background:totProfit>=0?'#ECFDF5':'#FFF0F0', border:`1.5px solid ${totProfit>=0?'#6EE7B7':'#FCA5A5'}`}}>
              <p className="text-xs font-semibold mb-1" style={{color:totProfit>=0?'#065F46':'#DC2626'}}>Lợi nhuận</p>
              <p className="font-bold font-display text-base" style={{color:totProfit>=0?'#065F46':'#DC2626'}}>{totProfit>=0?'+':''}{fmtCurrency(totProfit)}</p>
            </div>
          </div>

          {/* Monthly breakdown — only if >1 month */}
          {allMonths.length > 1 && (
            <div className="rounded-2xl overflow-hidden card-shadow" style={{background:'var(--card)'}}>
              <div className="px-4 py-3" style={{borderBottom:'1px solid var(--border)'}}>
                <h3 className="font-bold text-sm" style={{color:'var(--text)'}}>Theo tháng</h3>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr style={{background:'var(--bg)'}}>
                      {['Tháng','Chi phí','Thực nhận','Lợi nhuận'].map(h=>(
                        <th key={h} className={`py-2 text-xs font-bold ${h==='Tháng'?'text-left px-4':'text-right px-3'}`}
                          style={{color:'var(--muted)'}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {monthStats.map(({m,exp,rev,profit})=>(
                      <tr key={m} style={{borderTop:'1px solid var(--border)'}}>
                        <td className="px-4 py-2.5 font-semibold" style={{color:'var(--text)'}}>{fmtMonth(m)}</td>
                        <td className="px-3 py-2.5 text-right" style={{color:'var(--primary)'}}>{fmtCurrency(exp)}</td>
                        <td className="px-3 py-2.5 text-right" style={{color:'#065F46'}}>{fmtCurrency(rev)}</td>
                        <td className="px-3 py-2.5 text-right font-bold" style={{color:profit>=0?'#065F46':'#DC2626'}}>{profit>=0?'+':''}{fmtCurrency(profit)}</td>
                      </tr>
                    ))}
                    <tr style={{borderTop:'2px solid var(--border)', background:'var(--bg)'}}>
                      <td className="px-4 py-2.5 font-bold" style={{color:'var(--text)'}}>Tổng</td>
                      <td className="px-3 py-2.5 text-right font-bold" style={{color:'var(--primary)'}}>{fmtCurrency(totExp)}</td>
                      <td className="px-3 py-2.5 text-right font-bold" style={{color:'#065F46'}}>{fmtCurrency(totRev)}</td>
                      <td className="px-3 py-2.5 text-right font-bold" style={{color:totProfit>=0?'#065F46':'#DC2626'}}>{totProfit>=0?'+':''}{fmtCurrency(totProfit)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Expenses list */}
          <div className="rounded-2xl overflow-hidden card-shadow" style={{background:'var(--card)'}}>
            <div className="flex items-center justify-between px-4 py-3" style={{borderBottom:'1px solid var(--border)'}}>
              <h3 className="font-bold text-sm" style={{color:'var(--text)'}}>Chi phí tools</h3>
              <button onClick={()=>setShowExpModal(true)}
                className="text-xs px-3 py-1.5 rounded-xl font-bold text-white"
                style={{background:'var(--primary)'}}>+ Thêm</button>
            </div>
            {expenses.length === 0
              ? <p className="text-sm text-center py-5" style={{color:'var(--muted)'}}>Chưa có khoản chi nào</p>
              : expenses.map(e=>(
                <div key={e.id} className="flex items-center gap-2 px-4 py-2.5" style={{borderBottom:'1px solid var(--border)'}}>
                  <div className="flex-shrink-0 text-xs font-bold" style={{color:'var(--muted)', minWidth:'3.5rem'}}>
                    {allMonths.length>1 ? e.date.slice(0,7).split('-').reverse().join('/') : fmtDate(e.date)}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold truncate" style={{color:'var(--text)'}}>{e.tool_name}</p>
                    {(e.channel||e.note) && <p className="text-xs truncate" style={{color:'var(--muted)'}}>{[e.channel,e.note].filter(Boolean).join(' · ')}</p>}
                  </div>
                  <span className="text-sm font-bold flex-shrink-0" style={{color:'var(--primary)'}}>{fmtCurrency(e.amount)}</span>
                  <button onClick={()=>deleteExp(e.id)}
                    className="w-7 h-7 rounded-lg flex items-center justify-center text-xs flex-shrink-0"
                    style={{background:'#FFF0F0', color:'#EF4444'}}>🗑</button>
                </div>
              ))
            }
            {expenses.length > 0 && (
              <div className="flex justify-end px-4 py-2" style={{background:'var(--bg)'}}>
                <span className="text-sm font-bold" style={{color:'var(--primary)'}}>Tổng: {fmtCurrency(totExp)}</span>
              </div>
            )}
          </div>

          {/* Revenue per month */}
          <div className="rounded-2xl overflow-hidden card-shadow" style={{background:'var(--card)'}}>
            <div className="px-4 py-3" style={{borderBottom:'1px solid var(--border)'}}>
              <h3 className="font-bold text-sm" style={{color:'var(--text)'}}>Doanh thu</h3>
              <p className="text-xs mt-0.5" style={{color:'var(--muted)'}}>Nhập xong bấm Lưu từng kênh</p>
            </div>
            {allMonths.map(m=>(
              <div key={m}>
                {allMonths.length > 1 && (
                  <div className="px-4 py-2" style={{background:'var(--bg)', borderBottom:'1px solid var(--border)'}}>
                    <span className="font-bold text-sm" style={{color:'var(--primary)'}}>{fmtMonth(m)}</span>
                  </div>
                )}
                {revChs.map(ch=>{
                  const isTong = ch === 'Tổng';
                  const key=m+'|'+ch, f=revForms[key]||{}, isSaving=!!savingRev[key];
                  // Tổng row: auto-sum all real channels for this month
                  const tongVals = isTong
                    ? ['revenue','commission','actual_received'].reduce((acc,fk)=>{
                        acc[fk] = channels.reduce((s,c)=>s+Number((revForms[m+'|'+c]||{})[fk]||0),0);
                        return acc;
                      },{})
                    : null;
                  const vals = isTong ? tongVals : f;
                  return (
                    <div key={ch} className="px-4 py-3" style={{borderBottom:'1px solid var(--border)', background:isTong?'var(--bg)':''}}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold px-2.5 py-0.5 rounded-full"
                          style={{background:isTong?'#E0E7FF':'var(--p-light)', color:isTong?'#3730A3':'var(--primary)'}}>
                          {ch}
                        </span>
                        {!isTong && (
                          <button onClick={()=>saveRevenue(m,ch)} disabled={isSaving}
                            className="text-xs px-3 py-1.5 rounded-xl font-bold"
                            style={{background:isSaving?'#A78BFA':'var(--primary)', color:'#fff'}}>
                            {isSaving?'Lưu...':'Lưu ✓'}
                          </button>
                        )}
                      </div>
                      <div className="grid gap-2" style={{gridTemplateColumns:'1fr 1fr 1fr'}}>
                        {[['revenue','Doanh thu'],['commission','Hoa hồng'],['actual_received','Thực nhận']].map(([fk,label])=>(
                          <div key={fk}>
                            <p className="text-xs mb-1" style={{color:'var(--muted)'}}>{label}</p>
                            {isTong ? (
                              <div className="w-full px-2.5 py-2 rounded-xl text-sm font-bold"
                                style={{background:'#E0E7FF', color:'#3730A3', border:'1.5px solid #C7D2FE'}}>
                                {new Intl.NumberFormat('vi-VN').format(vals[fk]||0)}
                              </div>
                            ) : (
                              <input
                                value={vals[fk] ? new Intl.NumberFormat('vi-VN').format(Number(vals[fk])) : ''}
                                onChange={e=>setRevField(m,ch,fk,e.target.value.replace(/\D/g,''))}
                                placeholder="0" inputMode="numeric"
                                className="w-full px-2.5 py-2 rounded-xl text-sm outline-none font-semibold"
                                style={{background:'var(--bg)', color:'var(--text)', border:'1.5px solid var(--border)'}} />
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          {showExpModal && (
            <ExpenseModal selMonth={toM} channels={channels}
              onSave={d=>{setExpenses(p=>[d,...p]); setShowExpModal(false);}}
              onClose={()=>setShowExpModal(false)} />
          )}
        </div>
      );
    }

    // ── SchedulePage ─────────────────────────────────────────────────────────────
    function SchedulePage({ products, channels }) {
      const today = TODAY();
      const _tom = new Date(); _tom.setDate(_tom.getDate()+1);
      const tomorrow = dateKey(_tom);
      const [range, setRange] = useState('week');
      const [selectedDate, setSelectedDate] = useState('');
      const [filterCh, setFilterCh] = useState('all');

      const weekStart = (() => { const d = new Date(); d.setDate(d.getDate()+2); return dateKey(d); })();
      const weekEnd = (() => { const d = new Date(); d.setDate(d.getDate()+8); return dateKey(d); })();
      const items = allScheduleItems(products)
        .filter(item => filterCh === 'all' || item.product?.channel === filterCh)
        .filter(item => {
          if (range === 'today') return item.schedule_date === today;
          if (range === 'tomorrow') return item.schedule_date === tomorrow;
          if (range === 'week') return item.schedule_date >= weekStart && item.schedule_date <= weekEnd;
          if (range === 'date') return item.schedule_date === selectedDate;
          return true;
        });
      const grouped = items.reduce((acc, item) => {
        (acc[item.schedule_date] ||= []).push(item);
        return acc;
      }, {});
      const dates = Object.keys(grouped).sort();
      const totalVideos = items.reduce((s, item) => s + Number(item.video_count || 0), 0);

      return (
        <div className="space-y-4">
          <div className="rounded-2xl p-4 card-shadow space-y-3" style={{background:'var(--card)'}}>
            <div className="flex gap-2 flex-wrap">
              {[['today','Hôm nay'],['tomorrow','Ngày mai'],['week','7 ngày'],['all','Tất cả']].map(([id,label])=>(
                <button key={id} onClick={()=>setRange(id)}
                  className="px-3 py-1.5 rounded-full text-xs font-bold"
                  style={{background:range===id?'var(--primary)':'var(--bg)', color:range===id?'#fff':'var(--muted)', border:`1.5px solid ${range===id?'var(--primary)':'var(--border)'}`}}>
                  {label}
                </button>
              ))}
              <input type="date" value={selectedDate}
                onChange={e=>{ setSelectedDate(e.target.value); setRange(e.target.value ? 'date' : 'week'); }}
                className="px-3 py-1.5 rounded-full text-xs font-bold outline-none"
                style={{background:range==='date'?'var(--primary)':'var(--bg)', color:range==='date'?'#fff':'var(--muted)', border:`1.5px solid ${range==='date'?'var(--primary)':'var(--border)'}`}} />
            </div>
            <div className="flex gap-2 flex-wrap">
              {[{id:'all',label:'Tất cả'}, ...channels.map(c=>({id:c,label:c}))].map(ch=>(
                <button key={ch.id} onClick={()=>setFilterCh(ch.id)}
                  className="px-3 py-1.5 rounded-full text-xs font-bold"
                  style={{background:filterCh===ch.id?'#ECFDF5':'var(--bg)', color:filterCh===ch.id?'#065F46':'var(--muted)', border:`1.5px solid ${filterCh===ch.id?'#6EE7B7':'var(--border)'}`}}>
                  {ch.label}
                </button>
              ))}
            </div>
            <div className="grid gap-3" style={{gridTemplateColumns:'1fr 1fr'}}>
              <div className="rounded-2xl px-3 py-2" style={{background:'var(--bg)'}}>
                <p className="text-xs font-semibold" style={{color:'var(--muted)'}}>Sản phẩm</p>
                <p className="text-xl font-bold font-display" style={{color:'var(--primary)'}}>{new Set(items.map(i=>i.product_id)).size}</p>
              </div>
              <div className="rounded-2xl px-3 py-2" style={{background:'#ECFDF5', border:'1px solid #6EE7B7'}}>
                <p className="text-xs font-semibold" style={{color:'#047857'}}>Video đăng</p>
                <p className="text-xl font-bold font-display" style={{color:'#065F46'}}>{totalVideos}</p>
              </div>
            </div>
          </div>

          {dates.length === 0 ? (
            <div className="text-center py-20">
              <div className="text-6xl mb-4">✦</div>
              <p className="font-semibold mb-1" style={{color:'var(--text)'}}>Không có lịch đăng</p>
              <p className="text-sm" style={{color:'var(--muted)'}}>Thử đổi bộ lọc hoặc thêm lịch trong sản phẩm</p>
            </div>
          ) : dates.map(date => {
            const dayItems = grouped[date];
            const dayVideos = dayItems.reduce((s,item)=>s+Number(item.video_count||0),0);
            return (
              <div key={date} className="rounded-2xl overflow-hidden card-shadow" style={{background:'var(--card)'}}>
                <div className="flex items-center justify-between px-4 py-3" style={{background:date===today?'#FFF7ED':'var(--bg)', borderBottom:'1px solid var(--border)'}}>
                  <div>
                    <h3 className="font-bold text-sm" style={{color:date===today?'#C2410C':'var(--text)'}}>
                      {date===today?'Hôm nay':date===tomorrow?'Ngày mai':fmtDate(date)}
                    </h3>
                    <p className="text-xs" style={{color:'var(--muted)'}}>{dayItems.length} sản phẩm · {dayVideos} video</p>
                  </div>
                  <span className="text-xs font-bold px-2.5 py-1 rounded-full" style={{background:'#ECFDF5', color:'#065F46', border:'1px solid #6EE7B7'}}>
                    {dayVideos} đăng
                  </span>
                </div>
                {dayItems.map(item => (
                  <div key={item.id} className="px-4 py-3" style={{borderBottom:'1px solid var(--border)'}}>
                    <div className="flex gap-3">
                      <div className="w-12 h-12 rounded-xl overflow-hidden flex items-center justify-center flex-shrink-0" style={{background:'var(--p-light)'}}>
                        {item.product?.image_data ? <img src={item.product.image_data} alt="" className="w-full h-full object-cover" /> : <span>🛍</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-1.5 flex-wrap mb-1">
                          {getProductCode(item.product) && <span className="text-xs px-2 py-0.5 rounded-full font-bold" style={{background:'#ECFDF5', color:'#065F46'}}>#{getProductCode(item.product)}</span>}
                          <span className="text-xs px-2 py-0.5 rounded-full font-bold" style={{background:'var(--p-light)', color:'var(--primary)'}}>{item.product?.channel}</span>
                        </div>
                        <p className="text-sm font-bold line-clamp-2" style={{color:'var(--text)'}}>{item.product?.name || 'Chưa có tên'}</p>
                        {item.note && <p className="text-sm mt-1 font-medium" style={{color:'#9D174D'}}>{item.note}</p>}
                        <div className="flex gap-2 mt-2 flex-wrap">
                          <span className="text-xs px-2.5 py-1 rounded-lg font-bold" style={{background:'var(--bg)', color:'var(--primary)'}}>{item.video_count||0} video đăng</span>
                          <span className="text-xs px-2.5 py-1 rounded-lg font-bold" style={{background:'#ECFDF5', color:'#065F46', border:'1px solid #6EE7B7'}}>còn {item.expected_remaining_count||0}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      );
    }

    // ── Root ──────────────────────────────────────────────────────────────────────
    function Root() {
      const [session,       setSession]       = useState(null);
      const [appLoading,    setAppLoading]    = useState(true);
      const [products,      setProducts]      = useState([]);
      const [channels,      setChannels]      = useState([]);
      const [activeChannel, setActiveChannel] = useState('all');
      const [activeStatus,  setActiveStatus]  = useState('all');
      const [showModal,     setShowModal]     = useState(false);
      const [editProduct,   setEditProduct]   = useState(null);
      const [activePage,    setActivePage]    = useState('products'); // 'products' | 'schedule' | 'expenses'

      useEffect(() => {
        sb.auth.getSession().then(({ data: { session } }) => {
          setSession(session); setAppLoading(false);
        });
        const { data: { subscription } } = sb.auth.onAuthStateChange((_, s) => setSession(s));
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!session) return;
        fetchAll();
        fetchChannels();
        const ch = sb.channel('products-rt')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, fetchAll)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'product_schedules' }, fetchAll)
          .subscribe();
        return () => sb.removeChannel(ch);
      }, [session]);

      async function fetchAll() {
        const { data } = await sb.from('products').select('*').order('created_at', { ascending: false });
        if (!data) return;
        let productsWithCodes = await ensureProductCodes(data);
        const { data: scheduleData, error: scheduleError } = await sb.from('product_schedules').select('*').order('schedule_date', { ascending: true });
        if (scheduleError && (scheduleError.code === '42P01' || (scheduleError.message || '').includes('product_schedules'))) {
          setProducts(productsWithCodes.map(p => ({...p, schedules: productSchedules(p)})));
          return;
        }
        if (scheduleError) {
          console.warn(scheduleError);
          setProducts(productsWithCodes);
          return;
        }
        const byProduct = (scheduleData || []).reduce((acc, row) => {
          (acc[row.product_id] ||= []).push(row);
          return acc;
        }, {});
        setProducts(productsWithCodes.map(p => ({...p, schedules: byProduct[p.id] || []})));
      }

      async function ensureProductCodes(list) {
        const usedCodes = new Set(list.map(getProductCode).filter(Boolean));
        let nextCode = Math.max(0, ...Array.from(usedCodes).map(c => Number(c) || 0)) + 1;
        let changed = false;
        const next = list.map(p => {
          if (getProductCode(p)) return p;
          changed = true;
          while (usedCodes.has(String(nextCode))) nextCode++;
          const product_code = String(nextCode++);
          usedCodes.add(product_code);
          return {...p, product_code};
        });
        if (!changed) return next;

        const updates = next
          .filter(p => !getProductCode(list.find(x => x.id === p.id)))
          .map(p => sb.from('products').update({product_code: p.product_code}).eq('id', p.id));
