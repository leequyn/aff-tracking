        const results = await Promise.all(updates);
        if (results.some(r => isMissingColumnError(r.error, 'product_code'))) {
          warnMissingProductCodeColumn();
          return list;
        }
        return next;
      }

      async function fetchChannels() {
        const { data } = await sb.from('channels').select('name').order('position');
        if (data && data.length > 0) setChannels(data.map(c => c.name));
      }

      function handleSaved(p) {
        if (!p) return;
        setProducts(prev => {
          const exists = prev.find(x => x.id === p.id);
          return exists ? prev.map(x => x.id === p.id ? p : x) : [p, ...prev];
        });
        setShowModal(false); setEditProduct(null);
      }

      function handleUpdate(p) {
        setProducts(prev => prev.map(x => x.id === p.id ? p : x));
      }

      async function handleDelete(id) {
        if (!confirm('Xoá sản phẩm này?')) return;
        await sb.from('products').delete().eq('id', id);
        setProducts(prev => prev.filter(x => x.id !== id));
      }

      // channels from DB table; fallback to products-derived if table empty
      const displayChannels = channels.length > 0
        ? channels
        : [...new Set(products.map(p => p.channel))].filter(Boolean).sort();
      const today    = TODAY();
      const _tom = new Date(); _tom.setDate(_tom.getDate()+1);
      const TOMORROW = dateKey(_tom);
      const scheduleOffsets = [2, 3, 4].map(n => {
        const d = new Date();
        d.setDate(d.getDate() + n);
        return { id: `plus_${n}`, label: `T+${n}`, date: dateKey(d) };
      });
      const filtered = sortProducts(
        products
          .filter(p => activeChannel === 'all' || p.channel === activeChannel)
          .filter(p => {
            if (activeStatus === 'post_today') return p.post_today || hasScheduleOn(p, today);
            if (activeStatus === 'tomorrow')   return hasScheduleOn(p, TOMORROW);
            const offsetFilter = scheduleOffsets.find(f => f.id === activeStatus);
            if (offsetFilter) return hasScheduleOn(p, offsetFilter.date);
            if (activeStatus === 'all')        return true;
            return p.status === activeStatus;
          })
      );
      const postTodayCount = products.filter(p => p.post_today || hasScheduleOn(p, today)).length;
      // alias for readability in JSX
      const chList = displayChannels;

      if (appLoading) return (
        <div className="min-h-screen flex items-center justify-center" style={{background:'var(--bg)'}}>
          <div className="text-center">
            <div className="text-5xl mb-3 pulse">✦</div>
            <p className="text-sm font-medium" style={{color:'var(--muted)'}}>Đang tải...</p>
          </div>
        </div>
      );

      if (!session) return <LoginPage />;

      const chFiltered = products.filter(p => activeChannel === 'all' || p.channel === activeChannel);
      const statusCount = {
        all:        chFiltered.length,
        post_today: chFiltered.reduce((sum, p) => sum + scheduledVideosOn(p, today), 0),
        tomorrow:   chFiltered.reduce((sum, p) => sum + scheduledVideosOn(p, TOMORROW), 0),
        ...Object.fromEntries(scheduleOffsets.map(f => [f.id, chFiltered.reduce((sum, p) => sum + scheduledVideosOn(p, f.date), 0)])),
        ...Object.fromEntries(STATUSES.map(s => [s.id, chFiltered.filter(p => p.status === s.id).length])),
      };

      const statusFilters = [
        { id:'all',        label:'Tất cả' },
        { id:'post_today', label:'📌 Hôm nay' },
        { id:'tomorrow',   label:'📅 Ngày mai' },
        ...scheduleOffsets.map(f => ({id:f.id, label:f.label})),
        ...STATUSES.map(s=>({id:s.id, label:s.label, dot:s.dot, bg:s.bg, fg:s.fg, ring:s.ring})),
      ];
      const activeScheduleDate =
        activeStatus === 'tomorrow' ? TOMORROW :
        activeStatus === 'post_today' ? today :
        (scheduleOffsets.find(f => f.id === activeStatus)?.date || today);

      return (
        <div className="min-h-screen pb-8" style={{background:'var(--bg)'}}>

          {/* Header */}
          <div className="sticky top-0 z-10 px-4 pt-4 pb-0" style={{background:'var(--bg)'}}>
            <div className="flex items-center justify-between mb-3">
              <div>
                <h1 className="font-display text-2xl font-bold" style={{color:'var(--text)'}}>
                  AFF <span style={{color:'var(--primary)'}}>Tracking</span>
                </h1>
                <p className="text-xs font-medium" style={{color:'var(--muted)'}}>Sản phẩm affiliate</p>
              </div>
              <div className="flex items-center gap-2">
                {activePage === 'products' && (
                  <button onClick={()=>{ setEditProduct(null); setShowModal(true); }}
                    className="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl text-white font-bold text-sm fab-shadow"
                    style={{background:'linear-gradient(135deg, var(--primary) 0%, #7C3AED 100%)'}}>
                    <span className="text-lg leading-none">+</span> Thêm SP
                  </button>
                )}
                <button onClick={()=>sb.auth.signOut()}
                  className="text-xs px-3 py-2.5 rounded-xl font-semibold"
                  style={{background:'var(--card)', color:'var(--muted)', border:'1px solid var(--border)'}}>
                  Thoát
                </button>
              </div>
            </div>

            {/* Stats */}
            <div className="flex gap-2 mb-3">
              <div className="flex-1 rounded-2xl px-3 py-2.5 card-shadow" style={{background:'var(--card)'}}>
                <p className="text-xs font-semibold" style={{color:'var(--muted)'}}>Sản phẩm</p>
                <p className="text-2xl font-bold font-display" style={{color:'var(--primary)'}}>{filtered.length}</p>
              </div>
              <div className="flex-1 rounded-2xl px-3 py-2.5"
                style={{background:'linear-gradient(135deg, var(--primary) 0%, #7C3AED 100%)'}}>
                <p className="text-xs font-semibold text-white" style={{opacity:.8}}>Đăng hôm nay</p>
                <p className="text-2xl font-bold font-display text-white">{postTodayCount}</p>
              </div>
            </div>

            {/* Page tabs */}
            <div className="flex gap-2 mb-3">
              {[['products','🛍 Sản phẩm'],['schedule','📅 Lịch đăng'],['expenses','💰 Chi phí']].map(([page,label])=>(
                <button key={page} onClick={()=>setActivePage(page)}
                  className="px-4 py-2 rounded-full text-sm font-bold"
                  style={{
                    background: activePage===page ? 'var(--primary)' : 'var(--card)',
                    color:      activePage===page ? '#fff' : 'var(--muted)',
                    border:     `1.5px solid ${activePage===page ? 'var(--primary)' : 'var(--border)'}`,
                  }}>
                  {label}
                </button>
              ))}
            </div>

            {/* Channel + status filters — only on products page */}
            {activePage === 'products' && (<>
              <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2 -mx-1 px-1">
                {[{id:'all',label:'Tất cả'}, ...chList.map(c=>({id:c,label:c}))].map(ch=>(
                  <button key={ch.id} onClick={()=>setActiveChannel(ch.id)}
                    className="flex-shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold"
                    style={{
                      background: activeChannel===ch.id ? 'var(--primary)' : 'var(--card)',
                      color:      activeChannel===ch.id ? '#fff' : 'var(--muted)',
                      border:     `1.5px solid ${activeChannel===ch.id ? 'var(--primary)' : 'var(--border)'}`,
                      transition: 'all 0.2s',
                    }}>
                    {ch.label}
                  </button>
                ))}
              </div>
              <div className="flex gap-2 overflow-x-auto no-scrollbar pb-3 -mx-1 px-1">
                {statusFilters.map(sf=>{
                  const active = activeStatus === sf.id;
                  return (
                    <button key={sf.id} onClick={()=>setActiveStatus(sf.id)}
                      className="flex-shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5"
                      style={{
                        background: active ? (sf.bg || 'var(--primary)') : 'var(--card)',
                        color:      active ? (sf.fg || '#fff')            : 'var(--muted)',
                        border:     `1.5px solid ${active ? (sf.ring || 'var(--primary)') : 'var(--border)'}`,
                        transition: 'all 0.2s',
                      }}>
                      {sf.dot && <span className="w-1.5 h-1.5 rounded-full" style={{background: active ? sf.dot : '#C4B8F5'}} />}
                      {sf.label}
                      {statusCount[sf.id] > 0 && (
                        <span className="rounded-full px-1.5 py-0.5 text-xs font-bold leading-none"
                          style={{
                            background: active ? 'rgba(0,0,0,0.15)' : 'var(--bg)',
                            color:      active ? (sf.fg || '#fff')  : 'var(--primary)',
                            minWidth: '1.25rem', textAlign: 'center',
                          }}>
                          {statusCount[sf.id]}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </>)}
          </div>

          {/* Content */}
          <div className="px-4 space-y-3">
            {activePage === 'expenses' ? (
              <ExpensePage channels={chList} />
            ) : activePage === 'schedule' ? (
              <SchedulePage products={products} channels={chList} />
            ) : filtered.length === 0 ? (
              <div className="text-center py-20">
                <div className="text-6xl mb-4">✦</div>
                <p className="font-semibold mb-1" style={{color:'var(--text)'}}>Không có sản phẩm nào</p>
                <p className="text-sm" style={{color:'var(--muted)'}}>Thử đổi bộ lọc hoặc thêm sản phẩm mới</p>
              </div>
            ) : filtered.map(p=>(
              <ProductCard key={p.id} product={p}
                scheduleFilterDate={activeScheduleDate}
                onUpdate={handleUpdate}
                onDelete={handleDelete}
                onEdit={()=>{ setEditProduct(p); setShowModal(true); }} />
            ))}
          </div>

          {/* Modal */}
          {showModal && (
            <ProductModal
              product={editProduct}
              channels={chList}
              onSave={handleSaved}
              onChannelsChange={setChannels}
              onClose={()=>{ setShowModal(false); setEditProduct(null); }} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
